name: adx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  ADX_CONNECTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-adx}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  DATABASE_URL: postgresql://${POSTGRES_USER:-adx}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  ADX_CONNECTOR_SESSION_SECRET: ${ADX_CONNECTOR_SESSION_SECRET:?Set ADX_CONNECTOR_SESSION_SECRET in deploy/.env}
  ADX_BOOTSTRAP_INVITE_HASH: ${ADX_BOOTSTRAP_INVITE_HASH:?Set ADX_BOOTSTRAP_INVITE_HASH in deploy/.env}
  ADX_CONNECTOR_SESSION_TTL_SECONDS: ${ADX_CONNECTOR_SESSION_TTL_SECONDS:-604800}
  ADX_CONNECTOR_COOKIE_NAME: ${ADX_CONNECTOR_COOKIE_NAME:-adx_session}
  ADX_CONNECTOR_COOKIE_SECURE: ${ADX_CONNECTOR_COOKIE_SECURE:-true}
  ADX_CONNECTOR_AUTH_RATE_LIMIT_ATTEMPTS: ${ADX_CONNECTOR_AUTH_RATE_LIMIT_ATTEMPTS:-10}
  ADX_CONNECTOR_PAIRING_RATE_LIMIT_ATTEMPTS: ${ADX_CONNECTOR_PAIRING_RATE_LIMIT_ATTEMPTS:-60}
  ADX_CONNECTOR_RATE_LIMIT_WINDOW_SECONDS: ${ADX_CONNECTOR_RATE_LIMIT_WINDOW_SECONDS:-60}
  ADX_CONNECTOR_MAX_PENDING_PAIRINGS: ${ADX_CONNECTOR_MAX_PENDING_PAIRINGS:-500}
  ADX_CONNECTOR_UNSAFE_DEMO: "false"
  ADX_ENV: ${ADX_ENV:-production}
  ADX_PUBLIC_APP_URL: ${ADX_PUBLIC_APP_URL:?Set ADX_PUBLIC_APP_URL in deploy/.env}
  ADX_ALLOWED_ORIGINS: ${ADX_PUBLIC_APP_URL:?Set ADX_PUBLIC_APP_URL in deploy/.env}
  ADX_CONNECTOR_MIGRATIONS_DIR: /app/db/migrations
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: postgres:17-alpine3.22@sha256:b02d9b5bcf608c2719da32cdabee274a33841202487fd5dc9b065b63f886753f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adx}
      POSTGRES_USER: ${POSTGRES_USER:-adx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=50
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 1m
    cpus: 0.75
    mem_limit: 768m
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: "no"
    command: ["python", "/app/deploy/scripts/migrate.py"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 512m
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      <<: *api-environment
      ADX_API_MAX_CONCURRENCY: ${ADX_API_MAX_CONCURRENCY:-256}
      ADX_FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    cpus: 0.75
    mem_limit: 768m
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${ADX_PUBLIC_APP_URL:?Set ADX_PUBLIC_APP_URL in deploy/.env}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/").then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 30s
    cpus: 0.75
    mem_limit: 768m
    logging: *default-logging

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      ADX_PUBLIC_HOST: ${ADX_PUBLIC_HOST:?Set ADX_PUBLIC_HOST in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/${ADX_CADDY_CONFIG:-Caddyfile.domain}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - certbot_config:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./deploy/artifacts:/srv/downloads:ro
    networks:
      - edge
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    cpus: 0.25
    mem_limit: 256m
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.7.0@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles:
      - tools
    volumes:
      - certbot_config:/etc/letsencrypt
      - certbot_lib:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  certbot_config:
  certbot_lib:
  certbot_www:

networks:
  edge:
  data:
    internal: true
