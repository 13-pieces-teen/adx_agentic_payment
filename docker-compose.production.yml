name: adx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  ADX_CONNECTOR_DATABASE_URL: postgresql://adx_api_login:${ADX_API_DATABASE_PASSWORD:?Set ADX_API_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  ADX_HOSTED_CONTROL_DATABASE_URL: postgresql://adx_api_login:${ADX_API_DATABASE_PASSWORD:?Set ADX_API_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  ADX_ARENA_API_DATABASE_URL: postgresql://adx_api_login:${ADX_API_DATABASE_PASSWORD:?Set ADX_API_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  DATABASE_URL: postgresql://adx_api_login:${ADX_API_DATABASE_PASSWORD:?Set ADX_API_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  ADX_CONNECTOR_SESSION_SECRET: ${ADX_CONNECTOR_SESSION_SECRET:?Set ADX_CONNECTOR_SESSION_SECRET in deploy/.env}
  ADX_GITHUB_OAUTH_CLIENT_ID: ${ADX_GITHUB_OAUTH_CLIENT_ID:-}
  ADX_GITHUB_OAUTH_CLIENT_SECRET: ${ADX_GITHUB_OAUTH_CLIENT_SECRET:-}
  ADX_GITHUB_OAUTH_CALLBACK_BASE_URL: ${ADX_GITHUB_OAUTH_CALLBACK_BASE_URL:-}
  ADX_GITHUB_OAUTH_STATE_TTL_SECONDS: ${ADX_GITHUB_OAUTH_STATE_TTL_SECONDS:-600}
  ADX_GITHUB_OAUTH_RELAY_URL: ${ADX_GITHUB_OAUTH_RELAY_URL:-}
  ADX_BOOTSTRAP_INVITE_HASH: ${ADX_BOOTSTRAP_INVITE_HASH:?Set ADX_BOOTSTRAP_INVITE_HASH in deploy/.env}
  ADX_CONNECTOR_SESSION_TTL_SECONDS: ${ADX_CONNECTOR_SESSION_TTL_SECONDS:-604800}
  ADX_CONNECTOR_COOKIE_NAME: ${ADX_CONNECTOR_COOKIE_NAME:-adx_session}
  ADX_CONNECTOR_COOKIE_SECURE: ${ADX_CONNECTOR_COOKIE_SECURE:-true}
  ADX_CONNECTOR_AUTH_RATE_LIMIT_ATTEMPTS: ${ADX_CONNECTOR_AUTH_RATE_LIMIT_ATTEMPTS:-10}
  ADX_CONNECTOR_PAIRING_RATE_LIMIT_ATTEMPTS: ${ADX_CONNECTOR_PAIRING_RATE_LIMIT_ATTEMPTS:-60}
  ADX_CONNECTOR_RATE_LIMIT_WINDOW_SECONDS: ${ADX_CONNECTOR_RATE_LIMIT_WINDOW_SECONDS:-60}
  ADX_CONNECTOR_MAX_PENDING_PAIRINGS: ${ADX_CONNECTOR_MAX_PENDING_PAIRINGS:-500}
  ADX_CONNECTOR_UNSAFE_DEMO: "false"
  ADX_ENV: ${ADX_ENV:-production}
  ADX_PUBLIC_APP_URL: ${ADX_PUBLIC_APP_URL:?Set ADX_PUBLIC_APP_URL in deploy/.env}
  ADX_ALLOWED_ORIGINS: ${ADX_PUBLIC_APP_URL:?Set ADX_PUBLIC_APP_URL in deploy/.env}
  ADX_CONNECTOR_MIGRATIONS_DIR: /app/db/migrations
  ADX_HOSTED_AGENTS_ENABLED: ${ADX_HOSTED_AGENTS_ENABLED:-false}
  ADX_ARENA_PARTICIPATION_ENABLED: ${ADX_ARENA_PARTICIPATION_ENABLED:-true}
  ADX_ARENA_CORE_ENABLED: ${ADX_ARENA_CORE_ENABLED:-true}
  ADX_ARENA_PAYMENTS_ENABLED: ${ADX_ARENA_PAYMENTS_ENABLED:-true}
  ADX_PUBLIC_API_URL: ${ADX_PUBLIC_API_URL:?Set ADX_PUBLIC_API_URL in deploy/.env}
  ADX_X402_FACILITATOR_ID: ${ADX_X402_FACILITATOR_ID:-}
  ADX_SETTLEMENT_SERVICE_URL: ${ADX_SETTLEMENT_SERVICE_URL:-http://settlement-worker:8790}
  ADX_SETTLEMENT_SERVICE_TOKEN: ${ADX_SETTLEMENT_SERVICE_TOKEN:?Set ADX_SETTLEMENT_SERVICE_TOKEN in deploy/.env}
  ADX_WALLET_RPC_URL: ${ADX_WALLET_RPC_URL:-https://k8s.testnet.json-rpc.injective.network/}
  ADX_WALLET_EXPLORER_URL: ${ADX_WALLET_EXPLORER_URL:-https://testnet.blockscout.injective.network}
  ADX_ARENA_EXPLORER_TX_URL_TEMPLATE: ${ADX_ARENA_EXPLORER_TX_URL_TEMPLATE:-}
  ADX_CURRENT_GAME_CHAIN_ID: ${ADX_CURRENT_GAME_CHAIN_ID:-1439}
  ADX_ARENA402_G_TOKEN_ADDRESS: ${ADX_ARENA402_G_TOKEN_ADDRESS:-}
  ADX_ARENA402_G_TOKEN_DECIMALS: ${ADX_ARENA402_G_TOKEN_DECIMALS:-6}
  ADX_ARENA402_M_TOKEN_ADDRESS: ${ADX_ARENA402_M_TOKEN_ADDRESS:-}
  ADX_ARENA402_M_TOKEN_DECIMALS: ${ADX_ARENA402_M_TOKEN_DECIMALS:-6}
  ADX_ARENA_ADMIN_GITHUB_SUBJECTS: ${ADX_ARENA_ADMIN_GITHUB_SUBJECTS:-}
  ADX_ARENA_CORE_DATABASE_URL: postgresql://adx_arena_core_login:${ADX_ARENA_CORE_DATABASE_PASSWORD:?Set ADX_ARENA_CORE_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
  ADX_HOSTED_FINGERPRINT_PEPPER_B64: ${ADX_HOSTED_FINGERPRINT_PEPPER_B64:-}
  ADX_HOSTED_FINGERPRINT_PEPPER_VERSION: ${ADX_HOSTED_FINGERPRINT_PEPPER_VERSION:-1}
  ADX_HOSTED_SECRET_BACKEND: ${ADX_HOSTED_SECRET_BACKEND:-tencent_ssm}
  ADX_HOSTED_CREDENTIAL_BACKEND_VERIFIED: ${ADX_HOSTED_CREDENTIAL_BACKEND_VERIFIED:-false}
  ADX_HOSTED_MASTER_KEY_FILE: /run/secrets/arena402/hosted-master.key
  ADX_HOSTED_MASTER_KEY_VERSION: ${ADX_HOSTED_MASTER_KEY_VERSION:-1}
  ADX_TENCENT_SSM_REGION: ${ADX_TENCENT_SSM_REGION:-ap-guangzhou}
  ADX_TENCENT_SSM_RECOVERY_WINDOW_DAYS: ${ADX_TENCENT_SSM_RECOVERY_WINDOW_DAYS:-0}
  ADX_TENCENT_SSM_IAM_VERIFIED: ${ADX_TENCENT_SSM_IAM_VERIFIED:-false}
  TENCENTCLOUD_SECRET_ID: ${ADX_TENCENT_SSM_WRITER_SECRET_ID:-}
  TENCENTCLOUD_SECRET_KEY: ${ADX_TENCENT_SSM_WRITER_SECRET_KEY:-}
  TENCENTCLOUD_TOKEN: ${ADX_TENCENT_SSM_WRITER_TOKEN:-}
  TZ: ${TZ:-Asia/Shanghai}

services:
  postgres:
    image: postgres:17-alpine3.22@sha256:b02d9b5bcf608c2719da32cdabee274a33841202487fd5dc9b065b63f886753f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adx}
      POSTGRES_USER: ${POSTGRES_USER:-adx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 1m
    cpus: 0.50
    mem_limit: 768m
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: "no"
    command:
      ["python", "/app/deploy/scripts/migrate.py", "--scope", "all"]
    environment:
      ADX_CONNECTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-adx}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      DATABASE_URL: postgresql://${POSTGRES_USER:-adx}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      ADX_CONNECTOR_MIGRATIONS_DIR: /app/db/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 512m
    logging: *default-logging

  provision-db-roles:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: "no"
    command: ["python", "/app/deploy/scripts/provision_db_roles.py"]
    environment:
      ADX_DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-adx}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      ADX_API_DATABASE_PASSWORD: ${ADX_API_DATABASE_PASSWORD:?Set ADX_API_DATABASE_PASSWORD in deploy/.env}
      ADX_HOSTED_WORKER_DATABASE_PASSWORD: ${ADX_HOSTED_WORKER_DATABASE_PASSWORD:?Set ADX_HOSTED_WORKER_DATABASE_PASSWORD in deploy/.env}
      ADX_ARENA_CORE_DATABASE_PASSWORD: ${ADX_ARENA_CORE_DATABASE_PASSWORD:?Set ADX_ARENA_CORE_DATABASE_PASSWORD in deploy/.env}
      ADX_SETTLEMENT_DATABASE_PASSWORD: ${ADX_SETTLEMENT_DATABASE_PASSWORD:?Set ADX_SETTLEMENT_DATABASE_PASSWORD in deploy/.env}
      ADX_CREDENTIAL_CONTROLLER_DATABASE_PASSWORD: ${ADX_CREDENTIAL_CONTROLLER_DATABASE_PASSWORD:?Set ADX_CREDENTIAL_CONTROLLER_DATABASE_PASSWORD in deploy/.env}
      ADX_WALLET_SIGNER_DATABASE_PASSWORD: ${ADX_WALLET_SIGNER_DATABASE_PASSWORD:?Set ADX_WALLET_SIGNER_DATABASE_PASSWORD in deploy/.env}
      ADX_WALLET_IMPORTER_DATABASE_PASSWORD: ${ADX_WALLET_IMPORTER_DATABASE_PASSWORD:?Set ADX_WALLET_IMPORTER_DATABASE_PASSWORD in deploy/.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 256m
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    environment:
      <<: *api-environment
      ADX_API_MAX_CONCURRENCY: ${ADX_API_MAX_CONCURRENCY:-64}
      ADX_FORWARDED_ALLOW_IPS: "*"
    depends_on:
      provision-db-roles:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    volumes:
      - type: bind
        source: ${ADX_HOSTED_SECRET_DIR_HOST_PATH:-./deploy/secrets}
        target: /run/secrets/arena402
        read_only: true
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    cpus: 0.50
    mem_limit: 512m
    logging: *default-logging

  hosted-worker:
    profiles:
      - hosted
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    command: ["python", "-m", "hosted_agent_runtime.production_worker"]
    environment:
      ADX_HOSTED_WORKER_DATABASE_URL: postgresql://adx_hosted_worker_login:${ADX_HOSTED_WORKER_DATABASE_PASSWORD:?Set ADX_HOSTED_WORKER_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      ADX_HOSTED_SECRET_BACKEND: ${ADX_HOSTED_SECRET_BACKEND:-tencent_ssm}
      ADX_HOSTED_CREDENTIAL_BACKEND_VERIFIED: ${ADX_HOSTED_CREDENTIAL_BACKEND_VERIFIED:-false}
      ADX_HOSTED_MASTER_KEY_FILE: /run/secrets/arena402/hosted-master.key
      ADX_HOSTED_MASTER_KEY_VERSION: ${ADX_HOSTED_MASTER_KEY_VERSION:-1}
      ADX_TENCENT_SSM_REGION: ${ADX_TENCENT_SSM_REGION:-ap-guangzhou}
      ADX_TENCENT_SSM_IAM_VERIFIED: ${ADX_TENCENT_SSM_IAM_VERIFIED:-false}
      TENCENTCLOUD_SECRET_ID: ${ADX_TENCENT_SSM_READER_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${ADX_TENCENT_SSM_READER_SECRET_KEY:-}
      TENCENTCLOUD_TOKEN: ${ADX_TENCENT_SSM_READER_TOKEN:-}
      ADX_OPENAI_COMPATIBLE_ENDPOINT: ${ADX_OPENAI_COMPATIBLE_ENDPOINT:-}
      ADX_OPENAI_COMPATIBLE_MODELS: ${ADX_OPENAI_COMPATIBLE_MODELS:-}
      ADX_HOSTED_WORKER_LEASE_SECONDS: ${ADX_HOSTED_WORKER_LEASE_SECONDS:-600}
      ADX_HOSTED_WORKER_POLL_SECONDS: ${ADX_HOSTED_WORKER_POLL_SECONDS:-1}
      ADX_HOSTED_WORKER_TASK_CONCURRENCY: ${ADX_HOSTED_WORKER_TASK_CONCURRENCY:-5}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      provision-db-roles:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    volumes:
      - type: bind
        source: ${ADX_HOSTED_SECRET_DIR_HOST_PATH:-./deploy/secrets}
        target: /run/secrets/arena402
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: 0.45
    mem_limit: 512m
    logging: *default-logging

  credential-controller:
    profiles:
      - hosted
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    command:
      ["python", "-m", "hosted_agent_control_plane.production_controller"]
    environment:
      ADX_CREDENTIAL_CONTROLLER_DATABASE_URL: postgresql://adx_credential_controller_login:${ADX_CREDENTIAL_CONTROLLER_DATABASE_PASSWORD:?Set ADX_CREDENTIAL_CONTROLLER_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      ADX_HOSTED_SECRET_BACKEND: ${ADX_HOSTED_SECRET_BACKEND:-tencent_ssm}
      ADX_HOSTED_CREDENTIAL_BACKEND_VERIFIED: ${ADX_HOSTED_CREDENTIAL_BACKEND_VERIFIED:-false}
      ADX_TENCENT_SSM_REGION: ${ADX_TENCENT_SSM_REGION:-ap-guangzhou}
      ADX_TENCENT_SSM_RECOVERY_WINDOW_DAYS: ${ADX_TENCENT_SSM_RECOVERY_WINDOW_DAYS:-0}
      ADX_TENCENT_SSM_IAM_VERIFIED: ${ADX_TENCENT_SSM_IAM_VERIFIED:-false}
      TENCENTCLOUD_SECRET_ID: ${ADX_TENCENT_SSM_CONTROLLER_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${ADX_TENCENT_SSM_CONTROLLER_SECRET_KEY:-}
      TENCENTCLOUD_TOKEN: ${ADX_TENCENT_SSM_CONTROLLER_TOKEN:-}
      ADX_CREDENTIAL_CONTROLLER_LEASE_SECONDS: ${ADX_CREDENTIAL_CONTROLLER_LEASE_SECONDS:-60}
      ADX_CREDENTIAL_CONTROLLER_POLL_SECONDS: ${ADX_CREDENTIAL_CONTROLLER_POLL_SECONDS:-1}
      ADX_CREDENTIAL_CONTROLLER_RETRY_SECONDS: ${ADX_CREDENTIAL_CONTROLLER_RETRY_SECONDS:-30}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      provision-db-roles:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: 0.10
    mem_limit: 192m
    logging: *default-logging

  arena-worker:
    profiles:
      - arena
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    command: ["python", "-m", "arena_game.production_worker"]
    environment:
      ADX_ARENA_CORE_DATABASE_URL: postgresql://adx_arena_core_login:${ADX_ARENA_CORE_DATABASE_PASSWORD:?Set ADX_ARENA_CORE_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      ADX_ARENA_SETTLEMENT_RPC_URL: ${ADX_ARENA_SETTLEMENT_RPC_URL:?Set ADX_ARENA_SETTLEMENT_RPC_URL in deploy/.env}
      ADX_ARENA_SETTLEMENT_BLOCKSCOUT_URL: ${ADX_ARENA_SETTLEMENT_BLOCKSCOUT_URL:-}
      ADX_ARENA_WORKER_LEASE_SECONDS: ${ADX_ARENA_WORKER_LEASE_SECONDS:-600}
      ADX_ARENA_WORKER_POLL_SECONDS: ${ADX_ARENA_WORKER_POLL_SECONDS:-0.25}
      ADX_ARENA_ORCHESTRATION_POLL_SECONDS: ${ADX_ARENA_ORCHESTRATION_POLL_SECONDS:-0.25}
      ADX_ARENA_FINALIZER_POLL_SECONDS: ${ADX_ARENA_FINALIZER_POLL_SECONDS:-1}
      ADX_SETTLEMENT_RECOVERY_POLL_SECONDS: ${ADX_SETTLEMENT_RECOVERY_POLL_SECONDS:-3}
      ADX_CURRENT_GAME_POLL_SECONDS: ${ADX_CURRENT_GAME_POLL_SECONDS:-1}
      ADX_CURRENT_GAME_ROUND_COUNT: ${ADX_CURRENT_GAME_ROUND_COUNT:-5}
      ADX_CURRENT_GAME_START_THRESHOLD: ${ADX_CURRENT_GAME_START_THRESHOLD:-10}
      ADX_CURRENT_GAME_MAX_PARTICIPANTS: ${ADX_CURRENT_GAME_MAX_PARTICIPANTS:-12}
      ADX_CURRENT_GAME_ACTION_TIMEOUT_MS: ${ADX_CURRENT_GAME_ACTION_TIMEOUT_MS:-90000}
      ADX_CURRENT_GAME_MAX_NEGOTIATION_TURNS: ${ADX_CURRENT_GAME_MAX_NEGOTIATION_TURNS:-3}
      ADX_CURRENT_GAME_CHAIN_ID: ${ADX_CURRENT_GAME_CHAIN_ID:-1439}
      ADX_CURRENT_GAME_TOKEN_ADDRESS: ${ADX_CURRENT_GAME_TOKEN_ADDRESS:-0x06D223D12774386A96D33863D9106A800e52BDeD}
      ADX_CURRENT_GAME_TOKEN_SYMBOL: ${ADX_CURRENT_GAME_TOKEN_SYMBOL:-mUSDC}
      ADX_CURRENT_GAME_TOKEN_DECIMALS: ${ADX_CURRENT_GAME_TOKEN_DECIMALS:-6}
      ADX_CURRENT_GAME_TOKEN_EIP712_NAME: ${ADX_CURRENT_GAME_TOKEN_EIP712_NAME:-Mock USD Coin}
      ADX_CURRENT_GAME_TOKEN_EIP712_VERSION: ${ADX_CURRENT_GAME_TOKEN_EIP712_VERSION:-1}
      ADX_CURRENT_GAME_REQUIRED_CONFIRMATIONS: ${ADX_CURRENT_GAME_REQUIRED_CONFIRMATIONS:-1}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      provision-db-roles:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: 0.30
    mem_limit: 320m
    logging: *default-logging

  settlement-worker:
    profiles:
      - settlement
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "arena_payments.production_service:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8790",
        "--no-access-log",
      ]
    environment:
      ADX_SETTLEMENT_DATABASE_URL: postgresql://adx_settlement_login:${ADX_SETTLEMENT_DATABASE_PASSWORD:?Set ADX_SETTLEMENT_DATABASE_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-adx}
      ADX_ARENA_AUTOMATIC_PAYMENTS_ENABLED: ${ADX_ARENA_AUTOMATIC_PAYMENTS_ENABLED:-false}
      ADX_SETTLEMENT_INTENT_ID: ${ADX_SETTLEMENT_INTENT_ID:-}
      ADX_ARENA_SETTLEMENT_RPC_URL: ${ADX_ARENA_SETTLEMENT_RPC_URL:?Set ADX_ARENA_SETTLEMENT_RPC_URL in deploy/.env}
      ADX_PUBLIC_API_URL: ${ADX_PUBLIC_API_URL:?Set ADX_PUBLIC_API_URL in deploy/.env}
      ADX_X402_FACILITATOR_URL: ${ADX_X402_FACILITATOR_URL:?Set ADX_X402_FACILITATOR_URL in deploy/.env}
      ADX_X402_FACILITATOR_ID: ${ADX_X402_FACILITATOR_ID:?Set ADX_X402_FACILITATOR_ID in deploy/.env}
      ADX_X402_FACILITATOR_AUTHORIZATION: ${ADX_X402_FACILITATOR_AUTHORIZATION:-}
      ADX_WALLET_SIGNER_URL: ${ADX_WALLET_SIGNER_URL:?Set ADX_WALLET_SIGNER_URL in deploy/.env}
      ADX_WALLET_SIGNER_TOKEN: ${ADX_WALLET_SIGNER_TOKEN:?Set ADX_WALLET_SIGNER_TOKEN in deploy/.env}
      ADX_SETTLEMENT_SERVICE_TOKEN: ${ADX_SETTLEMENT_SERVICE_TOKEN:?Set ADX_SETTLEMENT_SERVICE_TOKEN in deploy/.env}
      ADX_SETTLEMENT_WORKER_POLL_SECONDS: ${ADX_SETTLEMENT_WORKER_POLL_SECONDS:-0.5}
      ADX_SETTLEMENT_LEASE_SECONDS: ${ADX_SETTLEMENT_LEASE_SECONDS:-60}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      provision-db-roles:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    expose:
      - "8790"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8790/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: 0.20
    mem_limit: 256m
    logging: *default-logging

  wallet-signer:
    profiles:
      - testnet-signer
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.wallet-signer
    restart: unless-stopped
    init: true
    environment:
      ADX_WALLET_SIGNER_BACKEND: postgres_aesgcm
