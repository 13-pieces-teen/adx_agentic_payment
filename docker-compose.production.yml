      ADX_WALLET_MASTER_KEY_FILE: /run/secrets/wallet-vault/wallet-master.key
      ADX_WALLET_MASTER_KEY_VERSION: ${ADX_WALLET_MASTER_KEY_VERSION:-1}
      ADX_WALLET_SIGNER_TOKEN: ${ADX_WALLET_SIGNER_TOKEN:-}
      ADX_WALLET_SIGNER_ALLOWED_CHAIN_ID: ${ADX_WALLET_SIGNER_ALLOWED_CHAIN_ID:-1439}
      ADX_WALLET_SIGNER_PORT: "8787"
