        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${ADX_WALLET_SECRET_DIR_HOST_PATH:-./deploy/secrets}
        target: /run/secrets/wallet-vault
        read_only: true
    networks:
      - data
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:8787/health").then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 15s
    cpus: 0.20
    mem_limit: 256m
    logging: *default-logging

