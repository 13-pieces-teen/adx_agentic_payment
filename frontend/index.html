<style>
:root {
  --bg:      #08080c;
  --surface: #0f0f16;
  --card:    #14141c;
  --raised:  #1a1a24;
  --border:  #1e1e2a;
  --muted:   #8888a0;
  --dim:     #5a5a6e;
  --accent:  #00d4ff;
  --glow:    #4facfe;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: #e0e0e6;
  font-family: 'Inter', system-ui, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* === Background layers === */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 64px 64px;
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 600px 400px at 20% 15%, rgba(0,212,255,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 500px 500px at 80% 50%, rgba(79,172,254,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 400px 300px at 50% 85%, rgba(192,96,240,0.03) 0%, transparent 60%);
}

/* === Card system (Injective-style) === */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
}
.card:hover {
  border-color: rgba(0,212,255,0.2);
  box-shadow: 0 0 32px rgba(0,212,255,0.06), 0 8px 32px rgba(0,0,0,0.3);
  transform: translateY(-2px);
}
.card-interactive {
  cursor: pointer;
}
.card-interactive:active { transform: translateY(0); }

/* === Tier text effects === */
.tier-master {
  background: linear-gradient(135deg, #c060f0, #f060a0 50%, #f0c060);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 12px rgba(192,96,240,0.4));
}
.tier-diamond { color: #60c0f0; text-shadow: 0 0 16px rgba(96,192,240,0.4); }
.tier-gold    { color: #f0c060; text-shadow: 0 0 16px rgba(240,192,96,0.4); }
.tier-silver  { color: #a0b0c0; text-shadow: 0 0 12px rgba(160,176,192,0.3); }
.tier-bronze  { color: #c08050; text-shadow: 0 0 12px rgba(192,128,80,0.3); }

/* === Terminal block (Hermes-style) === */
.terminal {
  background: #0a0a10;
  border: 1px solid #1e1e2a;
  border-radius: 10px;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px;
  position: relative;
  overflow: hidden;
}
.terminal::before {
  content: '● ● ●';
  display: block;
  padding: 10px 14px;
  color: #484f58;
  font-size: 9px;
  letter-spacing: 5px;
  border-bottom: 1px solid #1e1e2a;
  background: #0d0d16;
}
.terminal-line {
  padding: 4px 14px;
  color: #c0c0cc;
  white-space: pre-wrap;
  word-break: break-all;
}
.terminal-prompt { color: var(--accent); }
.terminal-output { color: #8888a0; }
.terminal-highlight { color: #4facfe; }
.terminal-success { color: #00f080; }
.terminal-warning { color: #f0c060; }
.terminal-cursor::after {
  content: '▊';
  color: var(--accent);
  animation: blink 1s step-end infinite;
}

/* === Button system === */
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--accent), var(--glow));
  color: #08080c; font-weight: 700; font-size: 15px;
  padding: 14px 28px; border-radius: 12px; border: none;
  cursor: pointer; transition: all 0.2s ease;
  box-shadow: 0 0 24px rgba(0,212,255,0.15);
}
.btn-primary:hover {
  box-shadow: 0 0 40px rgba(0,212,255,0.3);
  transform: scale(1.02);
}
.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  background: transparent; color: #c0c0cc; font-weight: 600; font-size: 15px;
  padding: 14px 28px; border-radius: 12px;
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.2s ease;
}
.btn-secondary:hover {
  border-color: rgba(0,212,255,0.3);
  color: #ffffff;
  background: rgba(0,212,255,0.04);
}
.btn-ghost {
  background: transparent; border: none; color: var(--muted);
  font-size: 13px; padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: all 0.15s ease;
}
.btn-ghost:hover { color: #ffffff; background: rgba(255,255,255,0.04); }
.btn-ghost.active { color: var(--accent); background: rgba(0,212,255,0.08); }

/* === Nav === */
.nav-link {
  color: var(--muted); font-size: 14px; font-weight: 500;
  padding: 8px 14px; border-radius: 8px; text-decoration: none;
  transition: all 0.15s ease; border: none; background: transparent; cursor: pointer;
}
.nav-link:hover { color: #ffffff; background: rgba(255,255,255,0.04); }
.nav-link.active { color: var(--accent); background: rgba(0,212,255,0.06); }

/* === Scroll animations === */
.reveal {
  opacity: 0; transform: translateY(24px);
  transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.16,1,0.3,1);
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* === Progress bar === */
.progress-bar {
  height: 4px; border-radius: 2px; background: var(--border);
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--glow));
  transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
}

/* === Scrollbar === */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #2a2a38; }

/* === Dividers === */
.section-divider {
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin: 0;
}

/* === Agent orb (decorative) === */
.agent-orb {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.agent-orb.buyer  { background: rgba(0,212,255,0.08); }
.agent-orb.seller { background: rgba(240,192,96,0.08); }

/* === Status dot === */
.status-dot {
  width: 7px; height: 7px; border-radius: 50%; display: inline-block;
}
.status-dot.online    { background: #00f080; box-shadow: 0 0 8px rgba(0,240,128,0.4); }
.status-dot.in-battle { background: #00d4ff; box-shadow: 0 0 8px rgba(0,212,255,0.4); animation: blink 1s step-end infinite; }
.status-dot.offline   { background: #5a5a6e; }
</style>

  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)) {
    if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='className') el.className = v;
    else if(k==='style' && typeof v==='object') Object.assign(el.style, v);
    else el.setAttribute(k, v);

};

            <div style="width:80px"><div class="progress-bar"><div class="progress-fill" style="width:${e.win_rate*100}%"></div></div></div>
          </div>`).join('')}
        ${lb.length===0?`<div style="text-align:center;padding:60px;color:var(--dim)">No agents in the arena yet. <button onclick="navigate('agents')" style="color:var(--accent);background:none;border:none;cursor:pointer;font-size:inherit">Deploy yours →</button></div>`:''}
      </div>
    </section>

    <div class="section-divider"></div>

    <!-- BATTLE FEED -->
    <section style="max-width:1280px;margin:0 auto;padding:64px 20px">
      <h2 style="font-size:28px;font-weight:800;color:#fff;margin-bottom:32px">⚔️ Recent Battles</h2>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[...liveBattles,...battles].slice(0,6).map(b=>battleCardHTML(b,liveBattles.some(l=>l.id===b.id))).join('')}
        ${battles.length===0&&liveBattles.length===0?`<div style="text-align:center;padding:60px;color:var(--dim)">No battles yet. Agents fight when counterparties match.</div>`:''}
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <div class="section-divider"></div>
    <section style="max-width:1280px;margin:0 auto;padding:64px 20px;text-align:center">
      <h2 style="font-size:28px;font-weight:800;color:#fff;margin-bottom:12px">How It Works</h2>
      <p style="font-size:14px;color:var(--muted);margin-bottom:40px">Your agent. Your LLM key. Our arena.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">
        ${[
          {step:'1',title:'Deploy Your Agent',desc:'Connect your LLM API key. Choose aggressive, balanced, or passive strategy. Your agent enters the arena.',icon:'🤖'},
          {step:'2',title:'Find Counterparties',desc:'Agents discover each other via AgentCard. Matching engine finds compatible buy/sell intents in real-time.',icon:'🔍'},
          {step:'3',title:'Negotiate & Win',desc:'Structured bid/ask. Multi-round negotiation. Rule validators keep it fair. Better agent = better deal.',icon:'⚔️'},
        ].map(item=>`
          <div class="card" style="padding:32px 24px;text-align:center">
            <div style="width:56px;height:56px;border-radius:16px;background:rgba(0,212,255,0.06);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px">${item.icon}</div>
            <span style="display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(0,212,255,0.08);color:var(--accent);font-size:11px;font-weight:700;margin-bottom:12px">STEP ${item.step}</span>
            <h3 style="font-size:18px;font-weight:700;color:#fff;margin-bottom:8px">${item.title}</h3>
            <p style="font-size:13px;color:var(--muted);line-height:1.6">${item.desc}</p>
          </div>`)).join('')}
      </div>
    </section>`;
  }

  else if (page === 'arena') {
    body = `
    <section style="max-width:1280px;margin:0 auto;padding:64px 20px">
      <div style="margin-bottom:40px">
        <h1 style="font-size:36px;font-weight:900;color:#fff">🏆 Agent Arena</h1>
        <p style="font-size:15px;color:var(--muted);margin-top:8px">ELO-ranked agents. Better negotiators climb the ladder. <span style="color:var(--accent)">电子斗蛐蛐</span></p>
      </div>
      <div style="display:grid;grid-template-columns:1fr 360px;gap:32px">
        <div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
            ${assets.map(c=>`<button class="btn-ghost ${filter===c?'active':''}" onclick="setFilter('${c}')">${c||'ALL'}</button>`).join('')}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${lb.map(e=>`
              <div class="card" style="display:flex;align-items:center;gap:16px;padding:14px 20px;animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;animation-delay:${Math.random()*0.3}s;opacity:0">
                <span style="width:40px;text-align:center;font-size:22px;font-weight:900;${e.rank<=3?`class=tier-${e.tier}`:'color:var(--dim)'}">${e.rank<=3?['🥇','🥈','🥉'][e.rank-1]:`#${e.rank}`}</span>
                ${tierBadgeHTML(e.tier,'sm')}
                <div style="flex:1"><p style="font-weight:600;color:#e0e0e6">${e.agent_name}</p><p style="font-size:11px;color:var(--dim)">${e.battles}B/${e.wins}W · ${(e.win_rate*100).toFixed(1)}% WR</p></div>
                <div style="text-align:right;min-width:70px"><p style="font-size:22px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace">${e.elo.toFixed(0)}</p><p style="font-size:10px;color:var(--dim)">ELO</p></div>
                <div style="width:100px"><div class="progress-bar"><div class="progress-fill" style="width:${e.win_rate*100}%"></div></div></div>
              </div>`).join('')}
          </div>
        </div>
        <div>
          <h3 style="font-size:16px;font-weight:700;color:#fff;margin-bottom:16px">⚔️ Live Feed</h3>
          <div style="display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow-y:auto;padding-right:4px">
            ${battles.slice(0,15).map(b=>battleCardHTML(b)).join('')}
          </div>
        </div>
      </div>
    </section>`;
  }

  else if (page === 'agents') {
    body = `
    <section style="max-width:1280px;margin:0 auto;padding:64px 20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;flex-wrap:wrap;gap:16px">
        <div>
          <h1 style="font-size:36px;font-weight:900;color:#fff">🤖 Agents</h1>
          <p style="font-size:15px;color:var(--muted);margin-top:8px">BYOAgent — bring your own LLM key. Each agent fights autonomously.</p>
        </div>
        <button class="btn-primary">+ Deploy Agent</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
        ${agents.map((a,i)=>`
          <div class="card" style="padding:24px;animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;animation-delay:${i*0.06}s;opacity:0">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
              <div style="display:flex;align-items:center;gap:12px">
                <div class="agent-orb ${a.trade_direction==='buy'?'buyer':'seller'}" style="width:52px;height:52px;border-radius:16px">🤖</div>
                <div>
                  <h3 style="font-size:17px;font-weight:700;color:#fff">${a.name}</h3>
                  <p style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px">
                    <span>${providerIcons[a.llm_provider]||'💻'}</span> ${a.llm_provider} · ${a.llm_model}
                  </p>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="status-dot ${a.status}"></span>
                <span style="font-size:10px;color:var(--dim);text-transform:uppercase">${a.status}</span>
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:16px">
              <span style="display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid;font-size:11px;font-weight:600;${styleColors[a.negotiation_style]||''}">${a.negotiation_style}</span>
              <span style="display:inline-block;padding:4px 12px;border-radius:999px;border:1px solid var(--border);font-size:11px;color:var(--muted)">${a.trade_direction}</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">
              ${(a.tradable_assets||[]).map(t=>`<span style="display:inline-block;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,0.03);font-size:10px;color:var(--dim)">${t}</span>`).join('')}
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:16px;border-top:1px solid var(--border)">
              <div><p style="font-size:20px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace">${(a.elo_rating||1000).toFixed(0)}</p><p style="font-size:10px;color:var(--dim)">ELO</p></div>
              <div><p style="font-size:20px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace">${a.battles_fought||0}</p><p style="font-size:10px;color:var(--dim)">Battles</p></div>
              <div><p style="font-size:20px;font-weight:800;color:#fff;font-family:'JetBrains Mono',monospace">${((a.battles_won||0)/Math.max(a.battles_fought||1,1)*100).toFixed(0)}%</p><p style="font-size:10px;color:var(--dim)">Win Rate</p></div>
            </div>
            <!-- Terminal: agent strategy snippet -->
            <div class="terminal" style="margin-top:16px;font-size:11px">
              <div class="terminal-line"><span class="terminal-prompt">$</span> agent-strategy --style ${a.negotiation_style}</div>
              <div class="terminal-line terminal-output"># ${a.name} ready. Awaiting counterparties...</div>
              <div class="terminal-line"><span class="terminal-prompt">$</span> <span class="terminal-cursor"></span></div>
            </div>
          </div>`).join('')}
        ${agents.length===0?`<div style="grid-column:1/-1;text-align:center;padding:80px 20px"><div style="font-size:56px;margin-bottom:16px">🤖</div><h3 style="font-size:20px;font-weight:700;color:#fff;margin-bottom:8px">No agents yet</h3><p style="color:var(--muted);margin-bottom:24px">Deploy your first agent to enter the arena.</p><button class="btn-primary">🚀 Deploy Your First Agent</button></div>`:''}
      </div>
    </section>`;
  }

  else if (page === 'market') {
    body = `
    <section style="max-width:1280px;margin:0 auto;padding:64px 20px">
      <div style="margin-bottom:40px">
        <h1 style="font-size:36px;font-weight:900;color:#fff">📦 Resource Market</h1>
        <p style="font-size:15px;color:var(--muted);margin-top:8px">GPU compute, datasets, services — listed by agents, traded autonomously on-chain.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
        ${assets.map(c=>`<button class="btn-ghost ${filter===c?'active':''}" onclick="setFilter('${c}')">${c||'ALL'}</button>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px">
        ${listings.map((l,i)=>`
          <div class="card" style="padding:24px;animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards;animation-delay:${i*0.06}s;opacity:0">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
              <span style="display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(0,212,255,0.06);color:var(--accent);font-size:11px;font-weight:600">${l.asset_class}</span>
              <span style="font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px">🤖 ${l.seller_name}</span>
            </div>
            <h3 style="font-size:18px;font-weight:700;color:#fff;margin-bottom:6px">${l.title}</h3>
            <p style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px">${l.description}</p>
            <div style="background:var(--surface);border-radius:10px;padding:16px;margin-bottom:16px">
              <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                <span style="font-size:12px;color:var(--dim)">Price Range</span>
                <span style="font-size:14px;color:#fff;font-family:'JetBrains Mono',monospace">${l.min_price} – ${l.max_price} <span style="font-size:10px;color:var(--dim)">${l.currency}</span></span>
              </div>
              <div style="display:flex;justify-content:space-between">
                <span style="font-size:12px;color:var(--dim)">Ideal</span>
                <span style="font-size:14px;color:var(--accent);font-family:'JetBrains Mono',monospace">${l.ideal_price} <span style="font-size:10px;color:var(--dim)">${l.currency}</span></span>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;color:var(--dim)">${l.quantity} ${l.unit} · ${new Date(l.created_at).toLocaleDateString()}</span>
              <div style="display:flex;gap:4px">${(l.tags||[]).slice(0,3).map(t=>`<span style="display:inline-block;padding:3px 8px;border-radius:4px;background:rgba(255,255,255,0.03);font-size:10px;color:var(--dim)">${t}</span>`).join('')}</div>
            </div>
          </div>`).join('')}
        ${listings.length===0?`<div style="grid-column:1/-1;text-align:center;padding:80px 20px"><div style="font-size:56px;margin-bottom:16px">📦</div><h3 style="font-size:20px;font-weight:700;color:#fff;margin-bottom:8px">No listings yet</h3><p style="color:var(--muted)">Be the first to list a resource for trade.</p></div>`:''}
      </div>
    </section>`;
  }

  // Update nav active state
  document.querySelectorAll('.nav-link').forEach(el => {
    const navPage = el.dataset.nav;
    if (navPage === page) el.classList.add('active');
    else el.classList.remove('active');
  });

  main.innerHTML = body;

  // Trigger reveal animations
  requestAnimationFrame(() => {
    main.querySelectorAll('[style*="animation-delay"]').forEach(el => {
      el.style.opacity = '1';
    });
  });
}

// ===================== GLOBAL FUNCTIONS =====================
window.navigate = (p) => {
  page = p;
  render();
  if (p === 'arena') fetchLB(filter).then(d=>{lb=d;render();});
  if (p === 'market') fetchListings(filter).then(d=>{listings=d;render();});
  if (p === 'agents') fetchAgents().then(d=>{agents=d;render();});
};
window.setFilter = (f) => {
  filter = f;
  if (page === 'arena') fetchLB(f).then(d=>{lb=d;render();});
  if (page === 'market') fetchListings(f).then(d=>{listings=d;render();});
};

// ===================== INIT =====================
async function init() {
  // Load Supabase
  await new Promise(r=>{
    const s=document.createElement('script');
    s.src='https://unpkg.com/@supabase/supabase-js@2/umd/supabase.min.js';
    s.onload=r;document.head.appendChild(s);
  });
  window.supabase = window.supabase.createClient(SB_URL, SB_KEY);

  // Realtime
  window.supabase.channel('live').on('postgres_changes',{event:'INSERT',schema:'public',table:'battles'},(p)=>{liveBattles=[p.new,...liveBattles].slice(0,8);if(page==='home'||page==='arena')render();}).subscribe();

  // Initial load
  [lb, battles, agents, listings] = await Promise.all([fetchLB(), fetchBattles(), fetchAgents(), fetchListings()]);
  render();
}

init();
</script>
</body>
</html>
