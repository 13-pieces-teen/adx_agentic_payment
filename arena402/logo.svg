<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Layer 1: Deep shadow offset (3D depth) -->
    <g fill="none" stroke="currentColor" opacity="0.08" transform="translate(3,4)">
      <polygon points="50,10 90,50 50,90 10,50" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="36" stroke-width="1.5" stroke-dasharray="40 10 30 8 50 12 20 6"/>
      <circle cx="50" cy="48" r="24" stroke-width="1.2" stroke-dasharray="25 8 40 6 15 10"/>
    </g>

    <!-- Layer 2: Outer diamond/arena ring (deconstructed — missing segments) -->
    <g fill="none" stroke="currentColor">
      <!-- Main diamond — top half complete, bottom with gaps -->
      <polyline points="50,10 90,50 50,52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="50,52 10,50 50,10" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
      <!-- Bottom: fractured segments -->
      <line x1="50" y1="52" x2="65" y2="67" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="70" x2="78" y2="80" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="35" y1="67" x2="50" y2="52" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      <line x1="22" y1="80" x2="32" y2="70" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Layer 3: Concentric broken rings (radiating rupture) -->
    <g fill="none" stroke="currentColor">
      <!-- Outer ring — heavily shattered -->
      <circle cx="50" cy="48" r="34" stroke-width="1.5" stroke-dasharray="50 12 30 10 40 8 18 14" opacity="0.7"/>
      <!-- Mid ring — asymmetric fracture -->
      <circle cx="52" cy="50" r="22" stroke-width="1" stroke-dasharray="25 10 35 8 20 6" opacity="0.5"/>
      <!-- Inner ring — almost complete -->
      <circle cx="50" cy="49" r="12" stroke-width="0.8" stroke-dasharray="20 6 12 4" opacity="0.35"/>
    </g>

    <!-- Layer 4: Radial spikes (8 directions, alternating lengths + displacement) -->
    <g stroke="currentColor" fill="none" stroke-linecap="round">
      <!-- N -->
      <line x1="50" y1="3" x2="50" y2="18" stroke-width="1.5" opacity="0.6"/>
      <line x1="52" y1="6" x2="51" y2="16" stroke-width="0.8" opacity="0.3"/>
      <!-- NE -->
      <line x1="88" y1="15" x2="76" y2="28" stroke-width="1.2" opacity="0.5"/>
      <!-- E -->
      <line x1="95" y1="50" x2="79" y2="50" stroke-width="1.5" opacity="0.6"/>
      <line x1="93" y1="52" x2="80" y2="51" stroke-width="0.8" opacity="0.3"/>
      <!-- SE -->
      <line x1="84" y1="82" x2="73" y2="72" stroke-width="1.2" opacity="0.5"/>
      <!-- S (fractured — multiple fragments) -->
      <line x1="50" y1="93" x2="50" y2="82" stroke-width="1.5" opacity="0.6"/>
      <line x1="48" y1="90" x2="49" y2="83" stroke-width="0.8" opacity="0.3"/>
      <!-- SW -->
      <line x1="14" y1="84" x2="25" y2="74" stroke-width="1.2" opacity="0.5"/>
      <!-- W -->
      <line x1="5" y1="50" x2="21" y2="50" stroke-width="1.5" opacity="0.6"/>
      <line x1="8" y1="48" x2="20" y2="49" stroke-width="0.8" opacity="0.3"/>
      <!-- NW -->
      <line x1="12" y1="15" x2="24" y2="28" stroke-width="1.2" opacity="0.5"/>
    </g>

    <!-- Layer 5: "402" at the rupture center -->
    <g fill="currentColor" font-family="monospace" font-weight="bold">
      <text x="50" y="56" text-anchor="middle" font-size="16" letter-spacing="2">402</text>
    </g>

    <!-- Layer 6: Center void dot (the singularity) -->
    <circle cx="50" cy="50" r="2" fill="currentColor"/>
  </g>
</svg>
