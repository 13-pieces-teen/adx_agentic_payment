<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- 3D Shadow layer -->
    <g fill="none" stroke="currentColor" opacity="0.06" transform="translate(4,5)">
      <polygon points="100,8 190,60 190,98 100,118 10,98 10,60" stroke-width="3"/>
      <circle cx="100" cy="63" r="52" stroke-width="2" stroke-dasharray="70 16 40 12 60 20 30 8"/>
      <circle cx="100" cy="60" r="34" stroke-width="1.5" stroke-dasharray="35 12 55 8 25 14"/>
      <circle cx="100" cy="58" r="18" stroke-width="1" stroke-dasharray="25 8 18 6"/>
    </g>

    <!-- Diamond ring — fractured -->
    <g fill="none" stroke="currentColor">
      <polyline points="100,10 180,60 100,64" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="100,64 20,60 100,10" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
      <!-- Broken bottom segments -->
      <line x1="100" y1="64" x2="130" y2="88" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="136" y1="92" x2="158" y2="106" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="70" y1="88" x2="100" y2="64" stroke-width="2.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="42" y1="106" x2="64" y2="92" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Concentric rings -->
    <g fill="none" stroke="currentColor">
      <circle cx="100" cy="62" r="48" stroke-width="2.5" stroke-dasharray="80 18 50 14 60 16 30 10" opacity="0.75"/>
      <circle cx="104" cy="64" r="32" stroke-width="1.8" stroke-dasharray="40 15 55 12 30 8" opacity="0.55"/>
      <circle cx="102" cy="63" r="18" stroke-width="1.2" stroke-dasharray="28 10 18 6" opacity="0.4"/>
    </g>

    <!-- Radial spikes -->
    <g stroke="currentColor" fill="none" stroke-linecap="round">
      <line x1="100" y1="2" x2="100" y2="24" stroke-width="2" opacity="0.65"/>
      <line x1="103" y1="6" x2="102" y2="20" stroke-width="1.2" opacity="0.35"/>
      <line x1="186" y1="18" x2="160" y2="42" stroke-width="1.8" opacity="0.55"/>
      <line x1="196" y1="65" x2="170" y2="64" stroke-width="2" opacity="0.65"/>
      <line x1="192" y1="68" x2="172" y2="66" stroke-width="1.2" opacity="0.35"/>
      <line x1="180" y1="110" x2="156" y2="90" stroke-width="1.6" opacity="0.5"/>
      <line x1="100" y1="118" x2="100" y2="100" stroke-width="2" opacity="0.65"/>
      <line x1="96" y1="114" x2="98" y2="102" stroke-width="1.2" opacity="0.35"/>
      <line x1="14" y1="110" x2="40" y2="92" stroke-width="1.6" opacity="0.5"/>
      <line x1="4" y1="65" x2="30" y2="64" stroke-width="2" opacity="0.65"/>
      <line x1="8" y1="62" x2="28" y2="63" stroke-width="1.2" opacity="0.35"/>
      <line x1="16" y1="20" x2="40" y2="42" stroke-width="1.8" opacity="0.55"/>
    </g>

    <!-- Floating fragments (shattered debris) -->
    <g fill="currentColor">
      <rect x="148" y="28" width="4" height="2" opacity="0.4" transform="rotate(15,150,29)"/>
      <rect x="42" y="34" width="5" height="2" opacity="0.35" transform="rotate(-10,44,35)"/>
      <rect x="156" y="82" width="3" height="2" opacity="0.3" transform="rotate(25,157,83)"/>
      <rect x="38" y="78" width="4" height="1.5" opacity="0.35" transform="rotate(-20,40,79)"/>
      <rect x="128" y="108" width="6" height="2" opacity="0.3" transform="rotate(8,131,109)"/>
      <rect x="62" y="106" width="5" height="1.5" opacity="0.3" transform="rotate(-12,64,107)"/>
      <rect x="92" y="8" width="3" height="2" opacity="0.4" transform="rotate(5,93,9)"/>
    </g>

    <!-- "402" at center -->
    <text x="100" y="72" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="22" fill="currentColor" letter-spacing="3">402</text>

    <!-- Center singularity -->
    <circle cx="100" cy="64" r="2.5" fill="currentColor"/>
  </g>
</svg>
